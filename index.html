<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Schedule — MoritaSaki in the pool</title>
  <meta property="og:title" content="Live Schedule — MoritaSaki in the pool" />
  <meta property="og:description" content="MoritaSaki in the pool のライブスケジュール" />
  <meta property="og:image" content="https://raw.githubusercontent.com/nino-msip/moritasaki-in-the-pool/main/icons/ogp.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --red: #e62429;
      --black: #0d0d0d;
      --paper: #fff3b8;
      --paper-line: #e9d98f;
      --ink-dim: #5c5c5c;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--paper);
      color: var(--black);
      font-family: 'Roboto', 'Noto Sans JP', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100svh;
    }

    /* ── Header ── */
    header {
      border-bottom: 3px solid var(--red);
      background: var(--paper);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 60px;
    }
    header img {
      height: 26px;
      width: auto;
    }

    /* ── Streaming section ── */
    .stream-section {
      margin-top: 48px;
      margin-bottom: 8px;
    }
    .stream-question {
      font-family: 'Anton', 'Noto Sans JP', sans-serif;
      font-size: clamp(18px, 3.5vw, 24px);
      font-weight: 400;
      letter-spacing: 0.03em;
      text-align: center;
      margin-bottom: 20px;
    }
    .stream-question span {
      display: block;
      font-family: 'Roboto Condensed', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-dim);
      margin-bottom: 4px;
    }
    .stream-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .stream-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 18px 8px 14px;
      border-radius: 16px;
      text-decoration: none;
      transition: box-shadow 0.1s, transform 0.1s;
    }
    .stream-tab:active {
      transform: translateY(4px) !important;
    }
    .stream-tab.spotify {
      background: #caffbf; color: #0d5c1f;
      transform: rotate(-1.5deg);
      box-shadow: 0 5px 0 #7ec99d;
    }
    .stream-tab.apple {
      background: #ffadad; color: #7a0000;
      transform: rotate(1.5deg);
      box-shadow: 0 5px 0 #d98080;
    }
    .stream-tab.youtube {
      background: #ffd6a5; color: #7a3e00;
      transform: rotate(-1deg);
      box-shadow: 0 5px 0 #d9a96a;
    }
    .stream-tab.spotify:active  { box-shadow: 0 1px 0 #7ec99d; }
    .stream-tab.apple:active    { box-shadow: 0 1px 0 #d98080; }
    .stream-tab.youtube:active  { box-shadow: 0 1px 0 #d9a96a; }
    .stream-tab svg {
      width: 28px;
      height: 28px;
    }
    .stream-tab-name {
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* ── Main ── */
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 20px 64px;
    }

    h1 {
      font-family: 'Anton', 'Noto Sans JP', sans-serif;
      font-weight: 400;
      font-size: clamp(28px, 6vw, 48px);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 32px;
      text-align: center;
    }
    h1 span {
      display: block;
      font-family: 'Roboto Condensed', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--red);
      margin-bottom: 6px;
    }

    /* ── Show Grid ── */
    .show-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: clamp(16px, 3vw, 28px);
    }

    .show-card { display: flex; flex-direction: column; }

    .show-plate {
      background: #fff;
      color: var(--black);
      aspect-ratio: 4 / 3;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--paper-line);
      text-decoration: none;
      transition: transform 0.15s ease;
    }
    a.show-plate:hover { transform: translateY(-3px); }
    .show-plate::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 5px;
      background: var(--red);
    }
    .show-plate.has-flyer { padding: 0; }
    .show-flyer-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .show-plate-scrim {
      position: relative;
      z-index: 1;
      padding: 14px 16px 18px;
      background: linear-gradient(to top, rgba(13,13,13,0.88), rgba(13,13,13,0));
    }
    .show-plate-title {
      font-family: 'Anton', 'Noto Sans JP', sans-serif;
      font-weight: 400;
      font-size: clamp(16px, 2vw, 20px);
      line-height: 1.2;
    }
    .show-plate.has-flyer .show-plate-title { color: #fff; }

    .show-meta {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .show-date {
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.04em;
      color: var(--red);
    }
    .show-venue { font-size: 13px; color: var(--black); }
    .show-city  { color: var(--ink-dim); }
    .show-performers {
      font-size: 12px;
      color: var(--ink-dim);
      margin-top: 2px;
    }

    .show-tickets {
      margin-top: 12px;
    }
    .ticket-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
      background: var(--red);
      padding: 14px 20px;
      text-decoration: none;
      border-radius: 100px;
      box-shadow: 0 5px 0 #8a0007;
      transition: box-shadow 0.1s, transform 0.1s;
      width: 100%;
      margin-bottom: 10px;
    }
    .ticket-pill:hover { background: #d0000a; }
    .ticket-pill:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #8a0007;
    }
    .ticket-pill::after { content: "→"; font-size: 14px; }
    .show-tba {
      font-family: 'Roboto Condensed', sans-serif;
      font-size: 12px;
      letter-spacing: 0.06em;
      color: #999;
      padding: 10px 0;
      display: block;
    }

    /* ── States ── */
    .loading, .empty, .error {
      font-family: 'Roboto Condensed', sans-serif;
      font-size: 14px;
      letter-spacing: 0.06em;
      color: var(--ink-dim);
      padding: 48px 0;
      text-align: center;
    }

    /* ── Bandsintown CTA ── */
    /* ── Bandsintown CTA ── */
    .bit-cta {
      margin-top: 0;
      margin-bottom: 40px;
      background: linear-gradient(135deg, #dff3ff 0%, #eef8ff 55%, #fff 100%);
      border: 1px solid #b8e0f7;
      padding: 18px 20px;
      display: grid;
      grid-template-columns: auto 1fr;
      grid-template-rows: auto auto;
      column-gap: 14px;
      row-gap: 12px;
      align-items: center;
    }
    .bit-cta-img {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #b8e0f7;
      grid-row: 1 / 3;
    }
    .bit-cta-body {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }
    .bit-cta-name {
      font-family: 'Anton', sans-serif;
      font-weight: 400;
      font-size: 16px;
      letter-spacing: 0.02em;
      line-height: 1.2;
    }
    .bit-cta-stats {
      font-family: 'Roboto Condensed', sans-serif;
      font-size: 11px;
      color: var(--ink-dim);
      letter-spacing: 0.03em;
    }
    .bit-cta-stats b { color: var(--black); }
    .bit-cta-sub {
      font-size: 11px;
      color: var(--ink-dim);
    }
    .bit-cta-btn {
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 10px 18px;
      background: var(--black);
      color: #fff;
      border-radius: 100px;
      box-shadow: 0 4px 0 #444;
      transition: box-shadow 0.1s, transform 0.1s, background 0.15s;
      text-align: center;
      grid-column: 2;
      white-space: nowrap;
    }
    .bit-cta-btn:hover { background: #222; }
    .bit-cta-btn:active { transform: translateY(4px); box-shadow: 0 0px 0 #444; }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 32px 20px;
      font-family: 'Roboto Condensed', sans-serif;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--ink-dim);
      border-top: 1px solid var(--paper-line);
    }
    footer a { color: var(--red); text-decoration: none; }
  </style>
</head>
<body>

  <header>
    <img src="https://raw.githubusercontent.com/nino-msip/moritasaki-in-the-pool/main/logo.avif" alt="MoritaSaki in the pool" />
  </header>

  <main>
    <h1>
      <span>MoritaSaki in the pool</span>
      Live Schedule
    </h1>

    <div class="bit-cta" id="bit-cta">

      <a class="bit-cta-btn" href="https://www.bandsintown.com/a/15665430" target="_blank" rel="noopener">♡ Follow</a>

    <div class="stream-section">

      </div>
      <div class="stream-grid">

          <svg fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M23.994 6.124a9.23 9.23 0 00-.24-2.19c-.317-1.31-1.062-2.31-2.18-3.043a5.022 5.022 0 00-1.877-.726 10.496 10.496 0 00-1.564-.15c-.04-.003-.083-.01-.124-.013H5.986c-.152.01-.303.017-.455.026-.747.043-1.49.123-2.193.4-1.336.53-2.3 1.452-2.865 2.78-.192.448-.292.925-.363 1.408-.056.392-.088.785-.1 1.18 0 .032-.007.062-.01.093v12.223c.01.14.017.283.027.424.05.815.154 1.624.497 2.373.65 1.42 1.738 2.353 3.234 2.801.42.127.856.187 1.293.228.555.053 1.11.06 1.667.06h11.03a12.5 12.5 0 001.57-.1c.822-.106 1.596-.35 2.295-.81a5.046 5.046 0 001.88-2.207c.186-.42.293-.87.37-1.324.113-.675.138-1.358.137-2.04-.002-3.8 0-7.595-.003-11.393zm-6.423 3.99v5.712c0 .417-.058.827-.244 1.206-.29.59-.76.962-1.388 1.14-.35.1-.706.157-1.07.173-.95.045-1.773-.6-1.943-1.536a1.88 1.88 0 011.038-2.022c.323-.16.67-.25 1.018-.324.378-.082.758-.153 1.134-.24.274-.063.457-.23.51-.516a.904.904 0 00.02-.193c0-1.815 0-3.63-.002-5.443a.725.725 0 00-.026-.185c-.04-.15-.15-.243-.304-.234-.16.01-.318.035-.475.066-.76.15-1.52.303-2.28.456l-2.325.47-1.374.278c-.016.003-.032.01-.048.013-.277.077-.377.203-.39.49-.002.042 0 .086 0 .13-.002 2.602 0 5.204-.003 7.805 0 .42-.047.836-.215 1.227-.278.64-.77 1.04-1.434 1.233-.35.1-.71.16-1.075.172-.96.036-1.755-.6-1.92-1.544-.14-.812.23-1.685 1.154-2.075.357-.15.73-.232 1.108-.31.287-.06.575-.116.86-.177.383-.083.583-.323.6-.714v-.15c0-2.96 0-5.922.002-8.882 0-.123.013-.25.042-.37.07-.285.273-.448.546-.518.255-.066.515-.112.774-.165.733-.15 1.466-.296 2.2-.444l2.27-.46c.67-.134 1.34-.27 2.01-.403.22-.043.442-.088.663-.106.31-.025.523.17.554.482.008.073.012.148.012.223.002 1.91.002 3.822 0 5.732z"/></svg>
          <span class="stream-tab-name">Apple Music</span>
        </a>
        <a class="stream-tab youtube" href="https://www.youtube.com/@moritasakiinthepool1739" target="_blank" rel="noopener">
          <svg fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
          <span class="stream-tab-name">YouTube</span>
        </a>
      </div>
    </div>
  </main>

  <footer>
    &copy; MoritaSaki in the pool &nbsp;·&nbsp;
    <a href="https://www.bandsintown.com/a/15665430" target="_blank" rel="noopener">Bandsintown</a>
  </footer>

<script>
  const BIT_APP_ID = '59eb73f72056941927ca5a752b0891de';
  const BIT_ARTIST = 'MoritaSaki in the pool';
  const FLYER_BASE = 'https://raw.githubusercontent.com/nino-msip/moritasaki-in-the-pool/main/flyers/';

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  window.__flyerFallback = function(img) {
    const exts = (img.dataset.exts || '').split(',').filter(Boolean);
    if (exts.length) {
      img.src = img.dataset.base + '.' + exts.shift();
      img.dataset.exts = exts.join(',');
    } else {
      img.closest('.show-plate')?.classList.remove('has-flyer');
      img.remove();
    }
  };

  function formatDate(s) {
    if (!s) return '';
    const d = new Date(s);
    if (isNaN(d)) return '';
    const wd = ['日','月','火','水','木','金','土'][d.getDay()];
    return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}（${wd}）`;
  }

  function flyerDate(s) {
    if (!s) return null;
    const d = new Date(s);
    if (isNaN(d)) return null;
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function vendorLabel(name) {
    if (!name) return 'Ticket';
    const n = name.toLowerCase();
    if (n.includes('livepocket')) return 'LivePocket';
    if (n.includes('zaiko'))     return 'Zaiko';
    if (n.includes('eplus'))     return 'e+';
    if (n.includes('tiget'))     return 'Tiget';
    if (n.includes('tixplus'))   return 'TixPlus';
    if (n.includes('peatix'))    return 'Peatix';
    return 'Ticket';
  }

  function renderEvent(e) {
    const dateStr = e.starts_at || e.datetime || '';
    const date    = esc(formatDate(dateStr));
    const fd      = flyerDate(dateStr);
    const title   = esc(e.title || '');
    const city    = esc(e.venue?.city || e.venue?.location || '');
    const performers = (e.lineup || [])
      .filter(n => n !== BIT_ARTIST).map(esc).join(', ');

    const tickets = (e.offers || []).map(o =>
      `<a href="${esc(o.url)}" target="_blank" rel="noopener" class="ticket-pill">${esc(vendorLabel(o.vendor_name))}</a>`
    );
    const primaryUrl = e.offers?.[0]?.url || null;

    const flyerBase = fd ? `${FLYER_BASE}${fd}` : null;
    const flyerImg  = flyerBase
      ? `<img class="show-flyer-bg" src="${flyerBase}.jpg" data-base="${flyerBase}" data-exts="jpeg,png,webp" onerror="window.__flyerFallback(this)" alt="" loading="lazy" />`
      : '';

    const plateInner = flyerImg
      ? `${flyerImg}<div class="show-plate-scrim"><span class="show-plate-title">${title || '(未定)'}</span></div>`
      : `<span class="show-plate-title">${title || '(未定)'}</span>`;
    const plateClass = flyerImg ? ' has-flyer' : '';
    const plate = primaryUrl
      ? `<a class="show-plate${plateClass}" href="${esc(primaryUrl)}" target="_blank" rel="noopener">${plateInner}</a>`
      : `<div class="show-plate${plateClass}">${plateInner}</div>`;

    return `
      <article class="show-card">
        ${plate}
        <div class="show-meta">
          <span class="show-date">${date}</span>
          <span class="show-venue show-city">${city}</span>
          ${performers ? `<span class="show-performers">w/ ${performers}</span>` : ''}
        </div>
        <div class="show-tickets">
          ${tickets.length ? tickets.join('') : '<span class="show-tba">準備中</span>'}
        </div>
      </article>`;
  }

  async function load() {
    const el = document.getElementById('live-list');
    try {
      const url = `https://rest.bandsintown.com/artists/${encodeURIComponent(BIT_ARTIST)}/events?app_id=${BIT_APP_ID}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error();
      const events = await res.json();
      if (!Array.isArray(events) || !events.length) {
        el.innerHTML = '<p class="empty">現在ライブの予定はありません。</p>';
        return;
      }
      el.innerHTML = `<div class="show-grid">${events.map(renderEvent).join('')}</div>`;
    } catch {
      el.innerHTML = '<p class="error">情報の取得に失敗しました。</p>';
    }
  }

  load();

  // Bandsintown フォロワー数・公演数をAPIから更新
  async function loadArtistStats() {
    try {
      const res = await fetch(`https://rest.bandsintown.com/artists/${encodeURIComponent(BIT_ARTIST)}?app_id=${BIT_APP_ID}`);
      if (!res.ok) return;
      const a = await res.json();
      const el = document.getElementById('bit-stats');
      if (el && a.tracker_count != null) {
        el.innerHTML = `<span>${a.tracker_count.toLocaleString()}</span> Followers &nbsp;·&nbsp; <span>${a.upcoming_event_count}</span> Upcoming Shows`;
      }
    } catch {}
  }
  loadArtistStats();
</script>
</body>
</html>
