<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Schedule — MoritaSaki in the pool</title>
  <meta property="og:title" content="Live Schedule — MoritaSaki in the pool" />
  <meta property="og:description" content="MoritaSaki in the pool のライブスケジュール" />
  <meta property="og:image" content="https://raw.githubusercontent.com/nino-msip/moritasaki-in-the-pool/main/icons/ogp.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --red: #e62429;
      --black: #0d0d0d;
      --paper: #fff3b8;
      --paper-line: #e9d98f;
      --ink-dim: #5c5c5c;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--paper);
      color: var(--black);
      font-family: 'Roboto', 'Noto Sans JP', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100svh;
    }

    /* ── Header ── */
    header {
      border-bottom: 3px solid var(--red);
      background: var(--paper);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 60px;
    }
    header img {
      height: 26px;
      width: auto;
    }

    /* ── Streaming tabs ── */
    .stream-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 40px;
      margin-bottom: 8px;
      padding-top: 4px;
    }
    .stream-label {
      font-family: 'Roboto Condensed', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-dim);
      margin-right: 4px;
    }
    .stream-tab {
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      padding: 7px 16px 8px;
      border-radius: 3px;
      box-shadow: 1px 2px 3px rgba(0,0,0,0.18);
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .stream-tab:hover {
      box-shadow: 2px 4px 8px rgba(0,0,0,0.22);
      transform: translateY(-1px) rotate(var(--r));
    }
    .stream-tab.spotify     { background: #caffbf; color: #0d5c1f; --r: -2deg; transform: rotate(-2deg); }
    .stream-tab.apple       { background: #ffadad; color: #7a0000; --r:  2deg; transform: rotate(2deg); }
    .stream-tab.youtube     { background: #ffd6a5; color: #7a3e00; --r: -1.5deg; transform: rotate(-1.5deg); }

    /* ── Main ── */
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 20px 64px;
    }

    h1 {
      font-family: 'Anton', 'Noto Sans JP', sans-serif;
      font-weight: 400;
      font-size: clamp(28px, 6vw, 48px);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 32px;
      text-align: center;
    }
    h1 span {
      display: block;
      font-family: 'Roboto Condensed', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--red);
      margin-bottom: 6px;
    }

    /* ── Show Grid ── */
    .show-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: clamp(16px, 3vw, 28px);
    }

    .show-card { display: flex; flex-direction: column; }

    .show-plate {
      background: #fff;
      color: var(--black);
      aspect-ratio: 4 / 3;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--paper-line);
      text-decoration: none;
      transition: transform 0.15s ease;
    }
    a.show-plate:hover { transform: translateY(-3px); }
    .show-plate::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 5px;
      background: var(--red);
    }
    .show-plate.has-flyer { padding: 0; }
    .show-flyer-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .show-plate-scrim {
      position: relative;
      z-index: 1;
      padding: 14px 16px 18px;
      background: linear-gradient(to top, rgba(13,13,13,0.88), rgba(13,13,13,0));
    }
    .show-plate-title {
      font-family: 'Anton', 'Noto Sans JP', sans-serif;
      font-weight: 400;
      font-size: clamp(16px, 2vw, 20px);
      line-height: 1.2;
    }
    .show-plate.has-flyer .show-plate-title { color: #fff; }

    .show-meta {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .show-date {
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.04em;
      color: var(--red);
    }
    .show-venue { font-size: 13px; color: var(--black); }
    .show-city  { color: var(--ink-dim); }
    .show-performers {
      font-size: 12px;
      color: var(--ink-dim);
      margin-top: 2px;
    }

    .show-tickets {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .ticket-pill {
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--black);
      border: 1px solid var(--paper-line);
      padding: 6px 14px;
      text-decoration: none;
      transition: border-color 0.15s, color 0.15s;
    }
    .ticket-pill:hover { border-color: var(--red); color: var(--red); }
    .show-tba { font-size: 12px; color: #999; }

    /* ── States ── */
    .loading, .empty, .error {
      font-family: 'Roboto Condensed', sans-serif;
      font-size: 14px;
      letter-spacing: 0.06em;
      color: var(--ink-dim);
      padding: 48px 0;
      text-align: center;
    }

    /* ── Bandsintown CTA ── */
    /* ── Bandsintown CTA ── */
    .bit-cta {
      margin-top: 0;
      margin-bottom: 40px;
      background: linear-gradient(135deg, #dff3ff 0%, #eef8ff 55%, #fff 100%);
      border: 1px solid #b8e0f7;
      padding: 18px 20px;
      display: grid;
      grid-template-columns: auto 1fr;
      grid-template-rows: auto auto;
      column-gap: 14px;
      row-gap: 12px;
      align-items: center;
    }
    .bit-cta-img {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #b8e0f7;
      grid-row: 1 / 3;
    }
    .bit-cta-body {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }
    .bit-cta-name {
      font-family: 'Anton', sans-serif;
      font-weight: 400;
      font-size: 16px;
      letter-spacing: 0.02em;
      line-height: 1.2;
    }
    .bit-cta-stats {
      font-family: 'Roboto Condensed', sans-serif;
      font-size: 11px;
      color: var(--ink-dim);
      letter-spacing: 0.03em;
    }
    .bit-cta-stats b { color: var(--black); }
    .bit-cta-sub {
      font-size: 11px;
      color: var(--ink-dim);
    }
    .bit-cta-btn {
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 9px 0;
      background: var(--black);
      color: #fff;
      border-radius: 20px;
      transition: background 0.15s;
      text-align: center;
      grid-column: 2;
    }
    .bit-cta-btn:hover { background: var(--red); }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 32px 20px;
      font-family: 'Roboto Condensed', sans-serif;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--ink-dim);
      border-top: 1px solid var(--paper-line);
    }
    footer a { color: var(--red); text-decoration: none; }
  </style>
</head>
<body>

  <header>
    <img src="https://raw.githubusercontent.com/nino-msip/moritasaki-in-the-pool/main/logo.avif" alt="MoritaSaki in the pool" />
  </header>

  <main>
    <h1>
      <span>MoritaSaki in the pool</span>
      Live Schedule
    </h1>

    <div class="bit-cta" id="bit-cta">
      <img class="bit-cta-img" src="https://photos.bandsintown.com/large/26186122.jpeg" alt="MoritaSaki in the pool" />
      <div class="bit-cta-body">
        <div class="bit-cta-name">MoritaSaki in the pool</div>
        <div class="bit-cta-stats" id="bit-stats"><b>125</b> Followers &nbsp;·&nbsp; <b>4</b> Upcoming Shows</div>
        <div class="bit-cta-sub">Bandsintownでバンドをチェックしよう</div>
      </div>
      <a class="bit-cta-btn" href="https://www.bandsintown.com/a/15665430" target="_blank" rel="noopener">♡ Follow</a>
    </div>

    <div id="live-list">
      <p class="loading">Loading...</p>
    </div>

    <div class="stream-bar">
      <span class="stream-label">Listen on</span>
      <a class="stream-tab spotify" href="https://open.spotify.com/artist/0cascybzS2QQL1m3h57tcY" target="_blank" rel="noopener">Spotify</a>
      <a class="stream-tab apple" href="https://music.apple.com/jp/artist/moritasaki-in-the-pool/1636167632" target="_blank" rel="noopener">Apple Music</a>
      <a class="stream-tab youtube" href="https://www.youtube.com/@moritasakiinthepool1739" target="_blank" rel="noopener">YouTube</a>
    </div>
  </main>

  <footer>
    &copy; MoritaSaki in the pool &nbsp;·&nbsp;
    <a href="https://www.bandsintown.com/a/15665430" target="_blank" rel="noopener">Bandsintown</a>
  </footer>

<script>
  const BIT_APP_ID = '59eb73f72056941927ca5a752b0891de';
  const BIT_ARTIST = 'MoritaSaki in the pool';
  const FLYER_BASE = 'https://raw.githubusercontent.com/nino-msip/moritasaki-in-the-pool/main/flyers/';

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  window.__flyerFallback = function(img) {
    const exts = (img.dataset.exts || '').split(',').filter(Boolean);
    if (exts.length) {
      img.src = img.dataset.base + '.' + exts.shift();
      img.dataset.exts = exts.join(',');
    } else {
      img.closest('.show-plate')?.classList.remove('has-flyer');
      img.remove();
    }
  };

  function formatDate(s) {
    if (!s) return '';
    const d = new Date(s);
    if (isNaN(d)) return '';
    const wd = ['日','月','火','水','木','金','土'][d.getDay()];
    return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}（${wd}）`;
  }

  function flyerDate(s) {
    if (!s) return null;
    const d = new Date(s);
    if (isNaN(d)) return null;
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function vendorLabel(name) {
    if (!name) return 'Ticket';
    const n = name.toLowerCase();
    if (n.includes('livepocket')) return 'LivePocket';
    if (n.includes('zaiko'))     return 'Zaiko';
    if (n.includes('eplus'))     return 'e+';
    if (n.includes('tiget'))     return 'Tiget';
    if (n.includes('tixplus'))   return 'TixPlus';
    if (n.includes('peatix'))    return 'Peatix';
    return 'Ticket';
  }

  function renderEvent(e) {
    const dateStr = e.starts_at || e.datetime || '';
    const date    = esc(formatDate(dateStr));
    const fd      = flyerDate(dateStr);
    const title   = esc(e.title || '');
    const city    = esc(e.venue?.city || e.venue?.location || '');
    const performers = (e.lineup || [])
      .filter(n => n !== BIT_ARTIST).map(esc).join(', ');

    const tickets = (e.offers || []).map(o =>
      `<a href="${esc(o.url)}" target="_blank" rel="noopener" class="ticket-pill">${esc(vendorLabel(o.vendor_name))}</a>`
    );
    const primaryUrl = e.offers?.[0]?.url || null;

    const flyerBase = fd ? `${FLYER_BASE}${fd}` : null;
    const flyerImg  = flyerBase
      ? `<img class="show-flyer-bg" src="${flyerBase}.jpg" data-base="${flyerBase}" data-exts="jpeg,png,webp" onerror="window.__flyerFallback(this)" alt="" loading="lazy" />`
      : '';

    const plateInner = flyerImg
      ? `${flyerImg}<div class="show-plate-scrim"><span class="show-plate-title">${title || '(未定)'}</span></div>`
      : `<span class="show-plate-title">${title || '(未定)'}</span>`;
    const plateClass = flyerImg ? ' has-flyer' : '';
    const plate = primaryUrl
      ? `<a class="show-plate${plateClass}" href="${esc(primaryUrl)}" target="_blank" rel="noopener">${plateInner}</a>`
      : `<div class="show-plate${plateClass}">${plateInner}</div>`;

    return `
      <article class="show-card">
        ${plate}
        <div class="show-meta">
          <span class="show-date">${date}</span>
          <span class="show-venue show-city">${city}</span>
          ${performers ? `<span class="show-performers">w/ ${performers}</span>` : ''}
        </div>
        <div class="show-tickets">
          ${tickets.length ? tickets.join('') : '<span class="show-tba">準備中</span>'}
        </div>
      </article>`;
  }

  async function load() {
    const el = document.getElementById('live-list');
    try {
      const url = `https://rest.bandsintown.com/artists/${encodeURIComponent(BIT_ARTIST)}/events?app_id=${BIT_APP_ID}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error();
      const events = await res.json();
      if (!Array.isArray(events) || !events.length) {
        el.innerHTML = '<p class="empty">現在ライブの予定はありません。</p>';
        return;
      }
      el.innerHTML = `<div class="show-grid">${events.map(renderEvent).join('')}</div>`;
    } catch {
      el.innerHTML = '<p class="error">情報の取得に失敗しました。</p>';
    }
  }

  load();

  // Bandsintown フォロワー数・公演数をAPIから更新
  async function loadArtistStats() {
    try {
      const res = await fetch(`https://rest.bandsintown.com/artists/${encodeURIComponent(BIT_ARTIST)}?app_id=${BIT_APP_ID}`);
      if (!res.ok) return;
      const a = await res.json();
      const el = document.getElementById('bit-stats');
      if (el && a.tracker_count != null) {
        el.innerHTML = `<span>${a.tracker_count.toLocaleString()}</span> Followers &nbsp;·&nbsp; <span>${a.upcoming_event_count}</span> Upcoming Shows`;
      }
    } catch {}
  }
  loadArtistStats();
</script>
</body>
</html>
